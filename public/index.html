<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>DeepSeek Harness · 控制台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M7 21V7h6.1C17.3 7 20 9.7 20 14s-2.7 7-6.9 7H7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M11.1 11.3h2c1.7 0 2.7 1 2.7 2.7s-1 2.7-2.7 2.7h-2v-5.4Z" fill="currentColor" opacity=".55"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>DeepSeek Harness</strong>
          <span>CONTROL CONSOLE</span>
        </div>
        <button class="icon-btn mobile-close" data-action="toggle-sidebar" aria-label="关闭菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="mode-switch" role="tablist" aria-label="工作模式">
        <button id="mode-projects" data-action="set-mode" data-mode="projects" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9Z"/></svg>
          项目
        </button>
        <button id="mode-tasks" data-action="set-mode" data-mode="tasks" role="tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M5 12h14M5 17h8"/><circle cx="19" cy="17" r="2.2"/></svg>
          任务
        </button>
      </div>

      <nav class="side-utils" aria-label="智能体与系统">
        <a class="util-link" href="#/manage" data-util="portfolio">
          <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9Z"/><path d="M3.8 12h16.4"/></svg></span>
          <span class="util-label">项目总管理</span>
        </a>
        <a class="util-link" href="#/memory" data-util="memory">
          <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="7" width="10" height="10" rx="2.2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/><circle cx="12" cy="12" r="1.6"/></svg></span>
          <span class="util-label">记忆库</span>
          <span class="util-count" id="util-memory-count">0</span>
        </a>
        <a class="util-link" href="#/skills" data-util="skills">
          <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4.5h2.2a1.8 1.8 0 1 1 3.6 0H17a1.5 1.5 0 0 1 1.5 1.5v2.2a1.8 1.8 0 1 1 0 3.6V14a1.5 1.5 0 0 1-1.5 1.5h-2.2a1.8 1.8 0 1 0-3.6 0H9A1.5 1.5 0 0 1 7.5 14v-2.2a1.8 1.8 0 1 1 0-3.6V6A1.5 1.5 0 0 1 9 4.5Z"/></svg></span>
          <span class="util-label">技能与工具</span>
          <span class="util-count" id="util-skills-count">0</span>
        </a>
        <a class="util-link" href="#/management" data-util="management">
          <span class="util-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14.7 6.3a4 4 0 0 0-5 5L4 17l3 3 5.7-5.7a4 4 0 0 0 5-5l-2.4 2.4-2.8-2.8 2.2-2.6Z"/></svg></span>
          <span class="util-label">软件管理</span>
        </a>
      </nav>

      <div class="side-head">
        <span id="side-title">项目</span>
        <span class="side-head-right">
          <span id="side-count">0</span>
          <button class="icon-btn tiny" id="add-folder" data-action="new-folder" title="新建文件夹" aria-label="新建文件夹">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9Z"/></svg>
          </button>
          <button class="icon-btn tiny" id="add-side" data-action="new-project" title="新建" aria-label="新建">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </span>
      </div>

      <div class="side-scroll" id="side-list"></div>

      <div class="side-footer">
        <button class="api-status" id="api-status" data-action="settings">
          <span class="dot warn" id="api-dot"></span>
          <span class="api-text"><strong id="api-label">检测中</strong><small id="api-sub">—</small></span>
        </button>
        <button class="icon-btn" data-action="settings" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" data-action="toggle-sidebar"></div>

    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="workspace-banner" id="workspace-banner" hidden></div>
      <section class="view" id="view">
        <div class="boot">
          <div class="boot-orbit"><span></span></div>
          <p>正在载入控制台</p>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
